<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/nexfit-download/business/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="مدير الأعمال — مَدّار">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="مدير الأعمال">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>مدير الأعمال — مَدّار</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#082B50">
</head>
<body>
  <!-- madar-splash:start -->
  <style>
    #madar-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:14px;background:#082B50;color:#fff;
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;direction:rtl;
      transition:opacity .35s ease}
    #madar-splash.hide{opacity:0;pointer-events:none}
    #madar-splash .ic{width:96px;height:96px;border-radius:28px;display:flex;align-items:center;
      justify-content:center;background:#14A3A122;border:1.5px solid #14A3A166;
      animation:mspulse 1.6s ease-in-out infinite}
    #madar-splash h1{margin:6px 0 0;font-size:26px;font-weight:800}
    #madar-splash p{margin:0;font-size:14px;opacity:.75}
    #madar-splash .bar{width:120px;height:3px;border-radius:3px;background:#ffffff22;overflow:hidden;margin-top:10px}
    #madar-splash .bar i{display:block;width:40%;height:100%;background:#14A3A1;animation:msbar 1.1s ease-in-out infinite}
    #madar-splash .by{position:absolute;bottom:28px;font-size:12px;opacity:.6;letter-spacing:.3px}
    #madar-splash .by b{color:#14A3A1;opacity:1}
    @keyframes mspulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes msbar{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}
  </style>
  <div id="madar-splash" role="status" aria-label="جارٍ تحميل مدير الأعمال">
    <div class="ic"><svg width="52" height="52" viewBox="0 0 24 24" fill="#14A3A1" aria-hidden="true"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg></div>
    <h1>مدير الأعمال</h1>
    <p>من أول معاينة حتى آخر جنيه</p>
    <div class="bar"><i></i></div>
    <div class="by">من <b>مَدّار</b></div>
  </div>
  <script>
    (function () {
      function hide() {
        var s = document.getElementById('madar-splash');
        if (!s) return;
        s.classList.add('hide');
        setTimeout(function () { s.remove(); }, 400);
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 20000); // أمان: لا تبقى للأبد لو تعطّل التحميل
    })();
  </script>
  <!-- madar-splash:end -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

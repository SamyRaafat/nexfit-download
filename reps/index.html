  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <script>if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.update();});});var _r=false;navigator.serviceWorker.addEventListener("controllerchange",function(){if(_r)return;_r=true;location.reload();});}</script>

<body>
  <!-- madar-splash:start -->
  <style>
    #madar-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:14px;background:#1F2A37;color:#fff;
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;direction:rtl;
      transition:opacity .35s ease}
    #madar-splash.hide{opacity:0;pointer-events:none}
    #madar-splash .ic{width:96px;height:96px;border-radius:28px;display:flex;align-items:center;
      justify-content:center;background:#E58A3A22;border:1.5px solid #E58A3A66;
      animation:mspulse 1.6s ease-in-out infinite}
    #madar-splash h1{margin:6px 0 0;font-size:26px;font-weight:800}
    #madar-splash p{margin:0;font-size:14px;opacity:.75}
    #madar-splash .bar{width:120px;height:3px;border-radius:3px;background:#ffffff22;overflow:hidden;margin-top:10px}
    #madar-splash .bar i{display:block;width:40%;height:100%;background:#E58A3A;animation:msbar 1.1s ease-in-out infinite}
    #madar-splash .by{position:absolute;bottom:28px;font-size:12px;opacity:.6;letter-spacing:.3px}
    #madar-splash .by b{color:#E58A3A;opacity:1}
    @keyframes mspulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes msbar{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}
  </style>
  <div id="madar-splash" role="status" aria-label="جارٍ تحميل منتجات المصانع">
    <div class="ic"><svg width="52" height="52" viewBox="0 0 24 24" fill="#E58A3A" aria-hidden="true"><path d="M22 22H2V10l7-3v2l5-2v3h3l1-8h3l1 8v12zM6 18h2v-3H6v3zm5 0h2v-3h-2v3zm5 0h2v-3h-2v3z"/></svg></div>
    <h1>منتجات المصانع</h1>
    <p>من المصنع إليك مباشرة</p>
    <div class="bar"><i></i></div>
    <div class="by">من <b>مَدّار</b></div>
  </div>
  <script>
    (function () {
      function hide() {
        var s = document.getElementById('madar-splash');
        if (!s) return;
        s.classList.add('hide');
        setTimeout(function () { s.remove(); }, 400);
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 20000); // أمان: لا تبقى للأبد لو تعطّل التحميل
    })();
  </script>
  <!-- madar-splash:end -->
  <script>
    window.flutterConfiguration = {
      canvasKitBaseUrl: "https://www.gstatic.com/flutter-canvaskit/cf56914b326edb0ccb123ffdc60f00060bd513fa/"
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

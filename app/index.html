  <meta charset="UTF-8">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <script>if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.update();});});var _r=false;navigator.serviceWorker.addEventListener("controllerchange",function(){if(_r)return;_r=true;location.reload();});}</script>

<body>
  <!-- madar-splash:start -->
  <style>
    #madar-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:14px;background:#0C2340;color:#fff;
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;direction:rtl;
      transition:opacity .35s ease}
    #madar-splash.hide{opacity:0;pointer-events:none}
    #madar-splash .ic{width:96px;height:96px;border-radius:28px;display:flex;align-items:center;
      justify-content:center;background:#F5A62322;border:1.5px solid #F5A62366;
      animation:mspulse 1.6s ease-in-out infinite}
    #madar-splash h1{margin:6px 0 0;font-size:26px;font-weight:800}
    #madar-splash p{margin:0;font-size:14px;opacity:.75}
    #madar-splash .bar{width:120px;height:3px;border-radius:3px;background:#ffffff22;overflow:hidden;margin-top:10px}
    #madar-splash .bar i{display:block;width:40%;height:100%;background:#F5A623;animation:msbar 1.1s ease-in-out infinite}
    #madar-splash .by{position:absolute;bottom:28px;font-size:12px;opacity:.6;letter-spacing:.3px}
    #madar-splash .by b{color:#F5A623;opacity:1}
    @keyframes mspulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes msbar{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}
  </style>
  <div id="madar-splash" role="status" aria-label="جارٍ تحميل سوق مدار">
    <div class="ic"><svg width="52" height="52" viewBox="0 0 24 24" fill="#F5A623" aria-hidden="true"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg></div>
    <h1>سوق مدار</h1>
    <p>تسوّق بأفضل الأسعار</p>
    <div class="bar"><i></i></div>
    <div class="by">من <b>مَدّار</b></div>
  </div>
  <script>
    (function () {
      function hide() {
        var s = document.getElementById('madar-splash');
        if (!s) return;
        s.classList.add('hide');
        setTimeout(function () { s.remove(); }, 400);
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 20000); // أمان: لا تبقى للأبد لو تعطّل التحميل
    })();
  </script>
  <!-- madar-splash:end -->
  <script>
    // رابط «صفحة المورّد» (?view=supplier) يعيش داخل تطبيق المتجر ⇒ هوية المورّد في شاشة البداية
    (function () {
      if (location.search.indexOf('view=supplier') < 0) return;
      var s = document.getElementById('madar-splash'); if (!s) return;
      s.style.background = '#3A1A10';
      s.querySelector('h1').textContent = 'صفحة المورّد';
      s.querySelector('p').textContent = 'اعرض خاماتك لمشترين أكثر';
      s.setAttribute('aria-label', 'جارٍ تحميل صفحة المورّد');
      var ic = s.querySelector('.ic'); ic.style.background = '#E4572E22'; ic.style.borderColor = '#E4572E66';
      ic.innerHTML = '<svg width="52" height="52" viewBox="0 0 24 24" fill="#E4572E" aria-hidden="true"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9 1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>';
      var bar = s.querySelector('.bar i'); if (bar) bar.style.background = '#E4572E';
    })();
  </script>
        <script>
    // CanvasKit من CDN مشترك (نفس إصدار المحرّك لكل التطبيقات) ⇒ يُحمَّل مرّة
    // ويُخزَّن للجميع، فيسرّع الانتقال بين التطبيقات.
    window.flutterConfiguration = {
      canvasKitBaseUrl: "https://www.gstatic.com/flutter-canvaskit/cf56914b326edb0ccb123ffdc60f00060bd513fa/"
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/nexfit-download/assistant/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="مساعد مدار — أسرتك وعائلتك وعمارتك في مكان واحد">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="مساعد مدار">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>مساعد مدار</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- madar-splash:start -->
  <style>
    #madar-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:14px;background:#06342A;color:#fff;
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;direction:rtl;
      transition:opacity .35s ease}
    #madar-splash.hide{opacity:0;pointer-events:none}
    #madar-splash .ic{width:96px;height:96px;border-radius:28px;display:flex;align-items:center;
      justify-content:center;background:#5DCAA522;border:1.5px solid #5DCAA566;
      animation:mspulse 1.6s ease-in-out infinite}
    #madar-splash h1{margin:6px 0 0;font-size:26px;font-weight:800}
    #madar-splash p{margin:0;font-size:14px;opacity:.75}
    #madar-splash .bar{width:120px;height:3px;border-radius:3px;background:#ffffff22;overflow:hidden;margin-top:10px}
    #madar-splash .bar i{display:block;width:40%;height:100%;background:#5DCAA5;animation:msbar 1.1s ease-in-out infinite}
    #madar-splash .by{position:absolute;bottom:28px;font-size:12px;opacity:.6;letter-spacing:.3px}
    #madar-splash .by b{color:#5DCAA5;opacity:1}
    @keyframes mspulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes msbar{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}
  </style>
  <div id="madar-splash" role="status" aria-label="جارٍ تحميل مساعد مدار">
    <div class="ic"><svg width="52" height="52" viewBox="0 0 24 24" fill="#5DCAA5" aria-hidden="true"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></div>
    <h1>مساعد مدار</h1>
    <p>أسرتك وعائلتك وعمارتك في مكان واحد</p>
    <div class="bar"><i></i></div>
    <div class="by">من <b>مَدّار</b></div>
  </div>
  <script>
    (function () {
      function hide() {
        var s = document.getElementById('madar-splash');
        if (!s) return;
        s.classList.add('hide');
        setTimeout(function () { s.remove(); }, 400);
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 20000); // أمان: لا تبقى للأبد لو تعطّل التحميل
    })();
  </script>
  <!-- madar-splash:end -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
